  mycarmate-states-api:
    build: /opt/teslamate/my-t-companion
    image: myt/companion:1.10.1
    restart: unless-stopped
    init: true
    cpus: 1.0
    mem_limit: 256m
    pids_limit: 128
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp:size=16m,mode=1777
    depends_on:
      - database
    environment:
      - DATABASE_USER=teslamate
      - DATABASE_PASS=${DATABASE_PASS}
      - DATABASE_NAME=teslamate
      - DATABASE_HOST=database
      - PGOPTIONS=-c default_transaction_read_only=on
      - API_TOKEN=${MY_T_API_TOKEN}
      - AUTH_PROBE_URL=${AUTH_PROBE_URL:-}
      - TZ=${TZ:-UTC}
      - MQTT_BROKER_URL=tcp://mosquitto:1883
      - PUSH_INSTALLATION_ID=${PUSH_INSTALLATION_ID:-}
      - PUSH_RELAY_URL=${PUSH_RELAY_URL:-}
      - PUSH_RELAY_SECRET=${PUSH_RELAY_SECRET:-}
      - PUSH_STATE_PATH=/data/software-notifications.json
      - NAVIGATION_PUSH_STATE_PATH=/data/navigation-live-activities.json
      - PARKING_EVENT_STATE_PATH=/data/parking-events.json
      - PARKING_EVENT_RETENTION_DAYS=${PARKING_EVENT_RETENTION_DAYS:-0}
      - PARKING_EVENT_MAX_EVENTS=${PARKING_EVENT_MAX_EVENTS:-50000}
    ports:
      - "127.0.0.1:8083:8080"
    volumes:
      - my-t-notification-state:/data
    healthcheck:
      test: ["CMD", "/app/states-api", "-healthcheck"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  my-t-notification-state:
