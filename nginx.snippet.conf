# Add these locations before the general TeslaMateAPI location.
# The Companion remains bound to 127.0.0.1:8083 on the same host.

location ~ ^/api/v1/cars/[0-9]+/states$ {
    proxy_pass http://127.0.0.1:8083;
    proxy_set_header Host $host;
    proxy_set_header Authorization $http_authorization;
    proxy_set_header X-API-Token $http_x_api_token;
    proxy_set_header CF-Access-Client-Id $http_cf_access_client_id;
    proxy_set_header CF-Access-Client-Secret $http_cf_access_client_secret;
}

location ~ ^/api/v1/cars/[0-9]+/navigation/current-drive$ {
    proxy_pass http://127.0.0.1:8083;
    proxy_set_header Host $host;
    proxy_set_header Authorization $http_authorization;
    proxy_set_header X-API-Token $http_x_api_token;
    proxy_set_header CF-Access-Client-Id $http_cf_access_client_id;
    proxy_set_header CF-Access-Client-Secret $http_cf_access_client_secret;
}

location = /api/v1/capabilities {
    proxy_pass http://127.0.0.1:8083;
    proxy_set_header Host $host;
    proxy_set_header Authorization $http_authorization;
    proxy_set_header X-API-Token $http_x_api_token;
    proxy_set_header CF-Access-Client-Id $http_cf_access_client_id;
    proxy_set_header CF-Access-Client-Secret $http_cf_access_client_secret;
}

location = /api/v1/notifications/software-update/status {
    proxy_pass http://127.0.0.1:8083;
    proxy_set_header Host $host;
    proxy_set_header Authorization $http_authorization;
    proxy_set_header X-API-Token $http_x_api_token;
    proxy_set_header CF-Access-Client-Id $http_cf_access_client_id;
    proxy_set_header CF-Access-Client-Secret $http_cf_access_client_secret;
}
